apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scaleforge.fullname" . }}
  labels:
    {{- include "scaleforge.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  JWT_ACCESS_TTL_SECONDS: {{ .Values.config.accessTokenTtlSeconds | quote }}
  JWT_REFRESH_TTL_SECONDS: {{ .Values.config.refreshTokenTtlSeconds | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
