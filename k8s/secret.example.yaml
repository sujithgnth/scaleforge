apiVersion: v1
kind: Secret
metadata:
  name: scaleforge-secrets
  namespace: scaleforge
type: Opaque
stringData:
  # Example only. Use External Secrets, Sealed Secrets, or your cloud secret manager.
  DATABASE_URL: postgresql://user:replace-me@postgres.example:5432/scaleforge?schema=public
  REDIS_URL: rediss://:replace-me@redis.example:6379
  RABBITMQ_URL: amqps://user:replace-me@rabbitmq.example:5671
  JWT_ACCESS_SECRET: replace-with-at-least-32-random-characters
  JWT_REFRESH_SECRET: replace-with-a-different-32-character-secret
  SENTRY_DSN: ''
