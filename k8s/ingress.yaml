apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scaleforge
  namespace: scaleforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['api.scaleforge.example.com']
      secretName: scaleforge-tls
  rules:
    - host: api.scaleforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scaleforge-api
                port:
                  name: http
